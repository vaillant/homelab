version: '3'

# Phase 3: Production VMs and containers.
# Phase 4: Deploy NixOS configurations to the running containers.
#
# Included by the root Taskfile with `dir` set to this folder, so `tofu`
# runs here automatically. Shared env and vars are inherited from the
# root Taskfile. Reference root-level tasks with a leading colon. The
# deploy tasks reference the flake at ../../nix, relative to this folder.

tasks:
  init:
    desc: Initialize production environment
    cmds:
      - tofu init

  plan:
    desc: Plan production changes
    deps: [':env-verify']
    cmds:
      - tofu plan -var="default_storage={{.DISK_STORAGE}}" -var="ssh_public_keys={{.SSH_PUBKEY}}"

  apply:
    desc: Apply production changes
    deps: [':env-verify']
    # svc-jellyfin uses LXC device passthrough (/dev/dri for VAAPI), which
    # Proxmox permits only for root@pam — API tokens get HTTP 403. Override auth
    # to root@pam for apply only (blank the token so the provider doesn't prefer
    # it). Other envs keep using the token. Password comes from 1Password.
    env:
      PROXMOX_VE_API_TOKEN: ""
      PROXMOX_VE_USERNAME: "root@pam"
      PROXMOX_VE_PASSWORD:
        sh: op read "op://Homelab/Proxmox Login/password"
    cmds:
      - tofu apply -auto-approve -var="default_storage={{.DISK_STORAGE}}" -var="ssh_public_keys={{.SSH_PUBKEY}}"

  output:
    desc: Show production outputs
    cmds:
      - tofu output

  verify:
    desc: Verify containers are reachable (ping, DNS, SSH)
    cmds:
      - |
        tofu refresh -var="default_storage={{.DISK_STORAGE}}" >/dev/null 2>&1
        HOSTNAMES=$(tofu output -json lxc_container_hostnames 2>/dev/null)
        IPS=$(tofu output -json lxc_container_ips 2>/dev/null)

        if [ -z "$HOSTNAMES" ] || [ "$HOSTNAMES" = "{}" ]; then
          echo "No containers found in terraform state"
          exit 0
        fi

        for KEY in $(echo "$HOSTNAMES" | jq -r 'keys[]'); do
          HOSTNAME=$(echo "$HOSTNAMES" | jq -r --arg k "$KEY" '.[$k]')
          IP=$(echo "$IPS" | jq -r --arg k "$KEY" '.[$k] // empty')
          FQDN="${HOSTNAME}.{{.DNS_SUFFIX}}"

          # Test ping to IP
          if [ -n "$IP" ]; then
            if ping -c 1 -W 2 "$IP" >/dev/null 2>&1; then
              PING_OK="✓"
            else
              PING_OK="✗"
            fi
          else
            PING_OK="-"
            IP="no-ip"
          fi

          # Test DNS resolution
          if dig +short "$FQDN" A | head -1 | grep -q .; then
            DNS_OK="✓"
          else
            DNS_OK="✗"
          fi

          # Test SSH (use IP if available, else FQDN)
          SSH_TARGET="${IP}"
          [ "$IP" = "no-ip" ] && SSH_TARGET="$FQDN"
          if ssh -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no "root@$SSH_TARGET" "echo ok" >/dev/null 2>&1; then
            SSH_OK="✓"
          else
            SSH_OK="✗"
          fi

          echo "$HOSTNAME ($IP) ping:$PING_OK dns:$DNS_OK ssh:$SSH_OK"
        done

  #
  # Phase 4: Deploy NixOS configurations
  #

  deploy-cloudflared:
    desc: Deploy cloudflared configuration
    cmds:
      - echo "Deploying cloudflared to svc-cloudflared.{{.DNS_SUFFIX}}..."
      - nixos-rebuild switch --target-host root@svc-cloudflared.{{.DNS_SUFFIX}} --flake ../../nix#cloudflared --use-remote-sudo

  deploy-pulse:
    desc: Deploy pulse configuration
    cmds:
      - echo "Deploying pulse to svc-pulse.{{.DNS_SUFFIX}}..."
      - nixos-rebuild switch --target-host root@svc-pulse.{{.DNS_SUFFIX}} --flake ../../nix#pulse --use-remote-sudo

  deploy-bose-soundtouch:
    desc: Deploy bose-soundtouch configuration
    cmds:
      - echo "Deploying bose-soundtouch to svc-bose-soundtouch.{{.DNS_SUFFIX}}..."
      - nixos-rebuild switch --target-host root@svc-bose-soundtouch.{{.DNS_SUFFIX}} --flake ../../nix#bose-soundtouch --use-remote-sudo

  deploy-jellyfin:
    desc: Deploy jellyfin configuration (override target with HOST=<ip> before DNS exists)
    vars:
      HOST: '{{.HOST | default (printf "svc-jellyfin.%s" .DNS_SUFFIX)}}'
    cmds:
      - echo "Deploying jellyfin to root@{{.HOST}} (building on {{.BUILDER_HOST}})..."
      - |
        # Push the rclone SMB credentials to the container, kept out of the nix
        # store: username + obscured password as an EnvironmentFile for the
        # rclone-nas service (RCLONE_CONFIG_NAS_USER / _PASS). rclone needs the
        # password "obscured", so run `rclone obscure` locally.
        SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        ENVF=$(mktemp)
        chmod 600 "$ENVF"
        trap 'rm -f "$ENVF"' EXIT
        NAS_USER="$(op read 'op://Homelab/NAS Folder/username')"
        # nix-shell prints a shell-hook banner on stdout; keep only the obscured
        # token (single line, base64url charset) so it can't corrupt the env file.
        NAS_PASS_OBSC="$(RCLONE_PW="$(op read 'op://Homelab/NAS Folder/password')" \
          nix-shell -p rclone --run 'rclone obscure "$RCLONE_PW"' 2>/dev/null \
          | grep -E '^[A-Za-z0-9_-]+$' | tail -n1)"
        printf 'RCLONE_CONFIG_NAS_USER=%s\nRCLONE_CONFIG_NAS_PASS=%s\n' "$NAS_USER" "$NAS_PASS_OBSC" > "$ENVF"
        ssh $SSHOPTS root@{{.HOST}} "mkdir -p /etc/nixos-secrets && chmod 700 /etc/nixos-secrets && rm -f /etc/nixos-secrets/nas-credentials"
        scp $SSHOPTS "$ENVF" root@{{.HOST}}:/etc/nixos-secrets/rclone-nas.env
        ssh $SSHOPTS root@{{.HOST}} "chmod 600 /etc/nixos-secrets/rclone-nas.env"
      - |
        # base.nix reads nix/secrets/ssh-pubkey and jellyfin.nix reads
        # nix/secrets/nas-share, but `nixos-rebuild --flake` only evaluates
        # git-tracked files, so stage them for this eval (never committed).
        SECRETS="nix/secrets/ssh-pubkey nix/secrets/nas-share"
        git -C ../.. add -f $SECRETS
        trap 'git -C ../.. reset -q HEAD $SECRETS' EXIT
        # NIX_SSHOPTS: fresh container isn't in ssh_config, so skip host-key checks.
        NIX_SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
          nixos-rebuild switch --flake ../../nix#jellyfin \
            --build-host root@{{.BUILDER_HOST}} \
            --target-host root@{{.HOST}} --use-remote-sudo
      - |
        # Restart rclone-nas so it picks up the credentials file: a no-op rebuild
        # won't restart the unit when only the out-of-band EnvironmentFile changed.
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          root@{{.HOST}} "systemctl restart rclone-nas"

  verify-jellyfin:
    desc: Verify Jellyfin web UI responds and the AMD render node is present (override with HOST=<ip>)
    silent: true
    vars:
      HOST: '{{.HOST | default (printf "svc-jellyfin.%s" .DNS_SUFFIX)}}'
    cmds:
      - echo "Checking jellyfin on {{.HOST}}..."
      - |
        FQDN="{{.HOST}}"
        # Web UI: public system info should return JSON without auth.
        if curl -fsS "http://${FQDN}:8096/System/Info/Public" | grep -q '"Version"'; then
          echo "✓ Jellyfin web UI responding on :8096"
        else
          echo "✗ Jellyfin web UI not responding — run 'task production:deploy-jellyfin'"; exit 1
        fi
        # GPU: render node present and VAAPI profiles enumerable inside the container.
        if ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no "root@${FQDN}" "ls /dev/dri/renderD128" >/dev/null 2>&1; then
          echo "✓ /dev/dri/renderD128 present in container"
          if ssh -o StrictHostKeyChecking=no "root@${FQDN}" "LIBVA_DRIVERS_PATH=/run/opengl-driver/lib/dri LIBVA_DRIVER_NAME=radeonsi vainfo 2>/dev/null | grep -qE 'VAProfile(H264|HEVC|AV1).*VAEntrypoint'"; then
            echo "✓ VAAPI hardware profiles (H264/HEVC/AV1) available"
          else
            echo "⚠ vainfo returned no VAAPI profiles — check driver/permissions"
          fi
        else
          echo "✗ /dev/dri/renderD128 missing — check device_passthrough / node has the iGPU"; exit 1
        fi
        # NAS SMB share: rclone-nas mounts it over FUSE at /srv/nas. Confirm the
        # service is active and the mount is a fuse (rclone) filesystem.
        if ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no "root@${FQDN}" "systemctl is-active --quiet rclone-nas && findmnt -rno FSTYPE /srv/nas | grep -q fuse"; then
          echo "✓ NAS SMB share mounted at /srv/nas (rclone/FUSE)"
          if ssh -o StrictHostKeyChecking=no "root@${FQDN}" "t=/srv/nas/.jellyfin-write-test.\$\$; touch \$t && rm -f \$t" 2>/dev/null; then
            echo "✓ /srv/nas is writable"
          else
            echo "⚠ /srv/nas mounted but not writable — check NAS share permissions"
          fi
        else
          echo "✗ NAS SMB share not mounted at /srv/nas — check the rclone-nas service, the fuse feature, and deploy"; exit 1
        fi

  deploy-all:
    desc: Deploy all container configurations
    cmds:
      - task: deploy-cloudflared
      - task: deploy-pulse
      - task: deploy-bose-soundtouch
      - task: deploy-jellyfin

  #
  # Phase 4: Deploy NixOS VM configurations
  #

  deploy-claude-dev:
    desc: Deploy Claude Code CLI config to claude-dev (override target with HOST=<ip> for the first deploy before DNS exists)
    vars:
      HOST: '{{.HOST | default (printf "claude-dev.%s" .DNS_SUFFIX)}}'
    cmds:
      - echo "Deploying claude-dev to {{.USERNAME}}@{{.HOST}} (building on {{.BUILDER_HOST}})..."
      - |
        # Secrets are gitignored, but `nixos-rebuild --flake` only evaluates
        # git-tracked files, so stage them for this eval (never committed).
        SECRETS="nix/secrets/ssh-pubkey nix/secrets/username nix/secrets/user-password-hash"
        git -C ../.. add -f $SECRETS
        trap 'git -C ../.. reset -q HEAD $SECRETS' EXIT
        # NIX_SSHOPTS: target host isn't in ssh_config, so skip host-key checks.
        NIX_SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
          nixos-rebuild switch --flake ../../nix#claude-dev \
            --build-host root@{{.BUILDER_HOST}} \
            --target-host {{.USERNAME}}@{{.HOST}} --use-remote-sudo

  verify-claude-dev:
    desc: Verify the Claude Code CLI is installed and runnable on claude-dev (override with HOST=<ip>)
    silent: true
    vars:
      HOST: '{{.HOST | default (printf "claude-dev.%s" .DNS_SUFFIX)}}'
    cmds:
      - echo "Checking claude on {{.USERNAME}}@{{.HOST}}..."
      - |
        ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no \
          {{.USERNAME}}@{{.HOST}} "claude --version" \
          && echo "✓ Claude Code CLI is installed" \
          || (echo "✗ claude not found — run 'task production:deploy-claude-dev'" && exit 1)
